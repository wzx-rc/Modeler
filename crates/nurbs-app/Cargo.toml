[package]
name = "nurbs-app"
edition.workspace = true
version.workspace = true
description = "Forme NURBS: the app (egui + wgpu). The part comes from the kernel process; the app draws its mesh and picks its faces"
build = "build.rs"

[lib]
name = "nurbs_app"
path = "src/lib.rs"

[[bin]]
name = "forme-nurbs"
path = "src/main.rs"

[[bin]]
name = "forme-nurbs-shot"
path = "src/bin/shot.rs"

[[bin]]
name = "forme-nurbs-mcp"
path = "src/bin/mcp.rs"

[dependencies]
nurbs-kernel = { path = "../nurbs-kernel" }
rectify-core = { path = "../rectify-core" }
glam.workspace = true
bytemuck.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true

# the pen's barrel button with Windows Ink (`pen.rs`)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_Pointer", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs"] }

[build-dependencies]
# the .exe's icon on Windows (rc.exe from the Windows SDK; a warning if missing)
winresource = "0.1"
