[workspace]
members = ["crates/forme-core", "crates/forme-render", "crates/forme-app", "crates/nurbs-core", "crates/nurbs-occ"]
# nurbs-occ builds OpenCascade from source (about 20 min the first time):
# only with `-p nurbs-occ`, never by a bare `cargo build`
default-members = ["crates/forme-core", "crates/forme-render", "crates/forme-app", "crates/nurbs-core"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Proprietary"

[workspace.dependencies]
glam = { version = "0.30", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
wgpu = "30"
egui = "0.37"
egui-wgpu = "0.37"
egui-winit = { version = "0.37", default-features = false, features = ["links", "wayland", "x11"] }
winit = "0.30"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.forme-core]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
