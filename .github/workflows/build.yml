name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      captures:
        description: "Aussi générer les captures d'écran (long)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Unsigned .ipa for iPad, to sideload with AltStore / Sideloadly (free Apple ID).
  # Built on both Mac flavours: GitHub's arm64 Macs are often saturated, the
  # first one to finish publishes (the result is the same .ipa).
  ipad:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Build Forme.ipa
        run: bash ios/build_ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Forme-ipa-${{ matrix.os }}
          path: target/ipa/Forme.ipa
      # direct download link: Releases > « Forme — dernière build iPad »
      - name: Publish the .ipa (release ipa-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-latest
          name: Forme — dernière build iPad
          prerelease: true
          make_latest: false
          body: |
            Build automatique du commit ${{ github.sha }}.
            Forme.ipa non signé : installe-le avec Sideloadly ou AltStore et ton Apple ID (à re-signer tous les 7 jours avec un compte gratuit).
          files: target/ipa/Forme.ipa
          overwrite_files: true

  # Core tests (and, on demand, screenshots of the real app on a software GPU).
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --release -p forme-core
      - name: Software Vulkan (lavapipe)
        if: ${{ inputs.captures }}
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Screenshots
        if: ${{ inputs.captures }}
        run: |
          mkdir -p shots
          cargo run --release -p forme-app --bin forme-shot -- shots
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.captures }}
        with:
          name: captures
          path: shots/*.png
